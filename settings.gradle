pluginManagement {
    // Apply machine-local network settings before plugin/dependency resolution.
    // Keep shared versions in gradle.properties; this optional file stays out of Git.
    def localSettings = new File(settingsDir, 'gradle-local.properties')
    if (localSettings.isFile()) {
        def localProperties = new Properties()
        localSettings.withInputStream { localProperties.load(it) }
        localProperties.each { key, value ->
            if (key.startsWith('systemProp.')) {
                System.setProperty(key.substring('systemProp.'.length()), value.toString())
            }
        }
    }
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.5.0'
}

rootProject.name = 'ModularMagic'
