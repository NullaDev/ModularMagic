# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.debug=false
# Fail unavailable repositories promptly instead of waiting for long network timeouts.
systemProp.org.gradle.internal.http.connectionTimeout=10000
systemProp.org.gradle.internal.http.socketTimeout=30000
# Local proxy for repositories affected by DNS/network issues on this machine.
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7890
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7890
# Java uses http.nonProxyHosts for both HTTP and HTTPS.
systemProp.http.nonProxyHosts=localhost|127.*|piston-data.mojang.com|resources.download.minecraft.net|libraries.minecraft.net|maven.theillusivec4.top|maven.blamejared.com|maven.ithundxr.dev

#read more on this at https://github.com/neoforged/NeoGradle/blob/NG_7.0/README.md#apply-parchment-mappings
# you can also find the latest versions at: https://parchmentmc.org/docs/getting-started
neogradle.subsystems.parchment.minecraftVersion=1.20.6
neogradle.subsystems.parchment.mappingsVersion=2024.06.02

