import groovy.json.JsonSlurper
import net.neoforged.gradle.dsl.common.extensions.MinecraftArtifactCache
import net.neoforged.gradle.dsl.common.util.CacheFileSelector
import net.neoforged.gradle.dsl.common.util.DistributionType

plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.165'
}

version = mod_version
group = mod_group_id

// NeoGradle 7.0.165 otherwise downloads launcher metadata during every configuration,
// even when launching an already-built, pinned Minecraft version from IntelliJ.
// Seed its public in-memory cache from existing files, without putting Maven offline.
if (!gradle.startParameter.refreshDependencies &&
        !providers.gradleProperty('refreshMinecraftMetadata').getOrElse('false').toBoolean()) {
    def artifacts = extensions.getByType(MinecraftArtifactCache)
    def cacheRoot = artifacts.cacheDirectory.get().asFile
    def cachedFile = { selector -> new File(new File(cacheRoot, selector.cacheDirectory), selector.cacheFileName) }
    def launcher = cachedFile(CacheFileSelector.launcherMetadata())
    def version = cachedFile(CacheFileSelector.forVersionJson(minecraft_version))
    def valid = false
    if (launcher.isFile() && version.isFile()) {
        try {
            def parser = new JsonSlurper()
            valid = parser.parse(version).id == minecraft_version &&
                    parser.parse(launcher).versions.any { it.id == minecraft_version }
        } catch (Exception ignored) {
            // Missing or invalid metadata follows the normal online bootstrap path.
        }
    }
    if (valid) {
        def originalOffline = gradle.startParameter.offline
        try {
            gradle.startParameter.offline = true
            artifacts.cacheLauncherMetadata()
            artifacts.cacheVersionManifest(minecraft_version).get()
            for (def side : [DistributionType.CLIENT, DistributionType.SERVER]) {
                if (cachedFile(CacheFileSelector.forVersionJar(minecraft_version, side.name)).isFile())
                    artifacts.cacheVersionArtifact(minecraft_version, side)
                if (cachedFile(CacheFileSelector.forVersionMappings(minecraft_version, side.name)).isFile())
                    artifacts.cacheVersionMappings(minecraft_version, side)
            }
        } finally {
            gradle.startParameter.offline = originalOffline
        }
        logger.lifecycle('Using cached Minecraft {} metadata (Maven offline: {}).', minecraft_version, originalOffline)
    }
}

repositories {
    mavenCentral()
    // Resolve bundled L2 libraries locally instead of querying every Maven server.
    exclusiveContent {
        forRepository {
            flatDir {
                name = 'bundledL2Libraries'
                dirs 'libs'
            }
        }
        filter { includeGroup 'dev.xkmc' }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Registrate'
                url = 'https://maven.ithundxr.dev/snapshots'
            }
        }
        filter { includeGroup 'com.tterrag.registrate' }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Curios'
                url = 'https://maven.theillusivec4.top/'
            }
        }
        filter { includeGroup 'top.theillusivec4.curios' }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'BlameJared'
                url = 'https://maven.blamejared.com'
            }
        }
        filter { includeGroup 'mezz.jei'; includeGroup 'vazkii.patchouli' }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

base {
    archivesName = mod_id
}

java {
    withSourcesJar()
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }
    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }
    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        arguments.add '--nogui'
    }
    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }
    data {
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations.gameTestImplementation.extendsFrom(configurations.implementation)
configurations.gameTestCompileOnly.extendsFrom(configurations.compileOnly)
configurations.gameTestRuntimeOnly.extendsFrom(configurations.runtimeOnly)
runs.gameTestServer {
    modSource project.sourceSets.gameTest
    systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
}

if (providers.gradleProperty('utilitiesSmoke').getOrElse('false').toBoolean()) {
    runs.client {
        modSource project.sourceSets.gameTest
        systemProperty 'modularmagic.utilitiesSmoke', 'true'
        arguments.addAll '--quickPlaySingleplayer', 'modularmagic-ui-smoke', '--width', '1280', '--height', '720'
    }
}
if (providers.gradleProperty('artificeSmoke').getOrElse('false').toBoolean()) {
    runs.client {
        modSource project.sourceSets.gameTest
        systemProperty 'modularmagic.artificeSmoke', 'true'
        arguments.addAll '--quickPlaySingleplayer', 'modularmagic-ui-smoke', '--width', '1280', '--height', '720'
    }
}
// Test-only client driver; excluded from regular runs and published JARs.
if (providers.gradleProperty('researchSmoke').getOrElse('false').toBoolean()) {
    runs.client {
        modSource project.sourceSets.gameTest
        systemProperty 'modularmagic.researchSmoke', 'true'
        arguments.addAll '--quickPlaySingleplayer', 'modularmagic-ui-smoke', '--width', '1280', '--height', '720'
    }
}
if (providers.gradleProperty('energySmoke').getOrElse('false').toBoolean()) {
    runs.client {
        modSource project.sourceSets.gameTest
        systemProperty 'modularmagic.energySmoke', 'true'
        arguments.addAll '--quickPlaySingleplayer', 'modularmagic-ui-smoke', '--width', '1280', '--height', '720'
    }
}
if (providers.gradleProperty('clientSmoke').getOrElse('false').toBoolean()) {
    runs.client {
        modSource project.sourceSets.gameTest
        systemProperty 'modularmagic.clientSmoke', 'true'
        arguments.addAll '--quickPlaySingleplayer', 'modularmagic-ui-smoke', '--width', '1280', '--height', '720'
    }
}


dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version         : neo_version, neo_version_range: neo_version_range,
            loader_version_range: loader_version_range,
            l2magic_version_range: l2magic_version_range,
            patchouli_version_range: patchouli_version_range,
            jade_version_range: jade_version_range,
            mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors         : mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "${mod_id}",
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1", // We are version 1 of ourselves
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors
        ])
    }
}

tasks.named('jarJar') {
    archiveClassifier.set('bundled')
}

dependencies {
    def required = [
            "dev.xkmc:l2magic:${l2magic_version}",
            "dev.xkmc:l2serial:${l2serial_ver}",
            "dev.xkmc:l2modularblocks:${l2modularblocks_ver}",
            "dev.xkmc:l2core:${l2core_ver}",
            "dev.xkmc:l2tabs:${l2tabs_ver}",
            "dev.xkmc:l2menustacker:${l2menustacker_ver}",
            "dev.xkmc:l2itemselector:${l2itemselector_ver}",
            "dev.xkmc:l2library:${l2library_ver}",
            "dev.xkmc:l2damagetracker:${l2damagetracker_ver}",
            "dev.xkmc:fast_projectile_api:${fast_projectile_api_ver}",
            "com.tterrag.registrate:Registrate:${registrate_version}",
            "maven.modrinth:jade:${jade_version}",
    ]
    def patchouli = "vazkii.patchouli:Patchouli:${patchouli_version}"

    required.each { implementation it }
    runtimeOnly patchouli
    // The list includes the engine's required runtime libraries. NeoForge supplies platform libraries.
    (required + patchouli).each { artifact ->
        jarJar(artifact) { transitive = false }
    }

    compileOnly "mezz.jei:jei-${jei_minecraft_version}:${jei_version}"
    runtimeOnly "mezz.jei:jei-${jei_minecraft_version}:${jei_version}"
    runtimeOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    if (providers.gradleProperty('enableRenderingMods').getOrElse('false').toBoolean()) {
        runtimeOnly "maven.modrinth:sodium:mc1.21.1-0.6.1-neoforge"
        runtimeOnly "maven.modrinth:iris:1.8.1+1.21.1-neoforge"
    }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach { useJUnitPlatform() }
